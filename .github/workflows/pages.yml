name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # بيانات القوافي: تُبنى هنا ولا تُرفع للمستودع. تُحفظ في الذاكرة المؤقتة
      # وتُعاد فقط إذا تغيّر كود القوافي أو المحرك (لأن عمود الوزن يعتمد عليه).
      - name: restore qawafi data
        id: qcache
        uses: actions/cache@v4
        with:
          path: docs/qawafi/data
          key: qawafi-data-${{ hashFiles('tools/qawafi/**', 'engine/**', 'data/meters.json') }}

      - uses: actions/setup-python@v5
        if: steps.qcache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: build qawafi data
        if: steps.qcache.outputs.cache-hit != 'true'
        working-directory: tools/qawafi
        run: |
          pip install pyarrow
          python build_qawafi.py --download --data /tmp/ashaar --out /tmp/qout
          python wazn.py --mizan ../.. --rhymes /tmp/qout/rhymes.csv
          python test_wazn.py --mizan ../.. --rhymes /tmp/qout/rhymes.csv --min 44
          python make_web.py --rhymes /tmp/qout/rhymes.csv --verses /tmp/qout/verses.jsonl.gz --out ../../docs/qawafi/data

      # محرك الموقع يُبنى من TypeScript بنفس إعداد الحزمة السابقة (طابقها حرفًا حرفًا قبل إصلاح الواو والياء)
      - name: build engine bundle
        run: npx --yes esbuild@0.28.2 src/lib/arud/index.ts --bundle --format=iife --global-name=Arud --target=es2019 --outfile=docs/engine.js --log-level=warning

      # حارس التطابق: محرك بايثون (الأرشيف) ومحرك الموقع. الأربعة المسموحة تعادلات قديمة معروفة
      - name: engine parity
        run: python3 tools/parity/parity.py --max-diffs 4

      # الصفحة الرئيسية تُولَّد من مولّدها حتى يبقى المولّد هو المرجع
      - name: build static index
        run: python3 scripts/build-static.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
